spec:
  containers:
    - name: snowflake-langflow
      image: /<DATABASE>/<SCHEMA>/<IMAGE_REPOSITORY>/snowflake-langflow:v0.1.0
      uid: 1000
      gid: 1000
      env:
        SNOWFLAKE_ACCOUNT: "<SNOWFLAKE_ACCOUNT>"
        SNOWFLAKE_DATABASE: "<DATABASE>"
        SNOWFLAKE_SCHEMA: "<SCHEMA>"
        SNOWFLAKE_STAGE_NAME: "<STAGE_NAME>"
        SNOWFLAKE_POSTGRES_INSTANCE: "<POSTGRES_INSTANCE>"
        LLM_PROXY_BASE_URL: "<LLM_PROXY_BASE_URL>"
        OLLAMA_BASE_URL: "<OLLAMA_BASE_URL>"
        LANGFLOW_HOST: "0.0.0.0"
        LANGFLOW_PORT: "7860"
        LANGFLOW_PERSIST_DIR: "/persist"
        LANGFLOW_CONFIG_DIR: "/persist/config"
        LANGFLOW_DATABASE_URL: "sqlite:////persist/langflow.db"
        LANGFLOW_BUNDLE_PACKAGES: "lfx_snowflake"
        LANGFLOW_TRACES_RUNS_TABLE: "<DATABASE>.<SCHEMA>.LANGFLOW_FLOW_RUNS"
        LANGFLOW_TRACES_SPANS_TABLE: "<DATABASE>.<SCHEMA>.LANGFLOW_FLOW_SPANS"
        LANGFLOW_AUDIT_LOG_TABLE: "<DATABASE>.<SCHEMA>.LANGFLOW_AUDIT_LOG"
        LANGFLOW_SECONDARY_ROLES_MODE: "NONE"
        LANGFLOW_ALLOW_SERVICE_ROLE_FALLBACK: "false"
        OTEL_SDK_DISABLED: "false"
      resources:
        requests:
          cpu: 0.5
          memory: 2.5Gi
        limits:
          cpu: 1
          memory: 4.5Gi
      volumeMounts:
        - name: langflow-transactional-block
          mountPath: /persist
      readinessProbe:
        port: 7860
        path: /api/v1/snowflake/context
      livenessProbe:
        port: 7860
        path: /api/v1/snowflake/context
        periodSeconds: 15
        failureThreshold: 3
  endpoints:
    - name: langflow-ui
      port: 7860
      public: true
    - name: langflow-a2a
      port: 7860
      public: false
  volumes:
    - name: langflow-transactional-block
      source: block
      size: 10Gi
      uid: 1000
      gid: 1000
  logExporters:
    eventTableConfig:
      logLevel: INFO
  platformMonitor:
    metricConfig:
      groups:
        - system
        - system_limits
        - status
        - network
        - storage
capabilities:
  securityContext:
    executeAsCaller: true
